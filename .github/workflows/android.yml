name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --org com.gazinizx
      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="Kuaförüm"/' android/app/src/main/AndroidManifest.xml
      - name: Configure image cropper activity
        run: |
          grep -q 'com.yalantis.ucrop.UCropActivity' android/app/src/main/AndroidManifest.xml || sed -i '/<\/application>/i\        <activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar" />' android/app/src/main/AndroidManifest.xml
      - name: Ensure release internet access
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
      - run: sed -i '/ndkVersion/d' android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kuaforum-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
