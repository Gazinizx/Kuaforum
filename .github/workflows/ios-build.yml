name: Build Kuaforum iOS (unsigned)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kuaforum-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.gazinizx --project-name kuaforum .; fi
      - name: Configure iOS app identity and media permissions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/Runner/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["CFBundleDisplayName"] = "Kuaförüm"
          data["NSCameraUsageDescription"] = "Profil ve kuaför çalışması fotoğrafı/video paylaşımı için kamera erişimi gerekir."
          data["NSPhotoLibraryUsageDescription"] = "Kuaför çalışması fotoğrafı ve videosu seçmek için fotoğraf arşivi erişimi gerekir."
          data["NSMicrophoneUsageDescription"] = "Paylaşım için video kaydederken ses kullanımı gerekir."
          types = data.get("CFBundleURLTypes", [])
          if not any("kuaforum" in item.get("CFBundleURLSchemes", []) for item in types):
              types.append({"CFBundleURLSchemes": ["kuaforum"]})
          data["CFBundleURLTypes"] = types
          path.write_bytes(plistlib.dumps(data))
          print("Kuaförüm iOS app name, media permissions and auth URL scheme configured.")
          PY
      - name: Set minimum iOS deployment target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          podfile = Path("ios/Podfile")
          text = podfile.read_text()
          if re.search(r"^platform :ios,", text, re.M):
              text = re.sub(r"^platform :ios,.*$", "platform :ios, '15.5'", text, flags=re.M)
          else:
              text = "platform :ios, '15.5'\\n" + text
          podfile.write_text(text)
          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = project.read_text()
          text = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;", "IPHONEOS_DEPLOYMENT_TARGET = 15.5;", text)
          project.write_text(text)
          print("iOS deployment target set to 15.5 for mobile_scanner.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=https://zhvfudtdnvgsqywojjrz.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_TQrHgIVWUTdaxB_-OrGzWA_pAK4cj57
      - uses: actions/upload-artifact@v4
        with:
          name: kuaforum-ios-app-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
