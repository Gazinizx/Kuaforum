name: Build Kuaforum Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name kuaforum .; fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://zhvfudtdnvgsqywojjrz.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_TQrHgIVWUTdaxB_-OrGzWA_pAK4cj57
      - uses: actions/upload-artifact@v4
        with:
          name: kuaforum-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
