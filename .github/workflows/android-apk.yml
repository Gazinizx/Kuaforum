name: Build Kuaforum Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kuaforum-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.gazinizx --project-name kuaforum .; fi
      - name: Configure app name, permissions and login deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text, count = re.subn(r'android:label="[^"]+"', 'android:label="Kuaförüm"', text, count=1)
          if count != 1:
              raise SystemExit("Android app label not found")
          for permission in [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]:
              if permission.split('"')[1] not in text:
                  pos = text.find("<application")
                  if pos < 0: raise SystemExit("Android application element missing")
                  text = text[:pos] + permission + "\n    " + text[pos:]
          if 'android:scheme="kuaforum"' not in text:
              start = text.find("<activity")
              end = text.find("</activity>", start)
              if start < 0 or end < 0: raise SystemExit("Main activity element missing")
              link = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="kuaforum" android:host="login-callback" />
                  </intent-filter>
              """
              text = text[:end] + link + text[end:]
          manifest.write_text(text)
          print("Kuaförüm Android label, permissions and auth deep link configured.")
          PY
      - name: Enable Java core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("android/app/build.gradle.kts")
          kotlin_dsl = app.exists()
          if not kotlin_dsl:
              app = Path("android/app/build.gradle")
          if not app.exists():
              raise SystemExit("Android app Gradle file not found")
          text = app.read_text()
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit("compileOptions block not found")
              setting = "\n        isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "\n        coreLibraryDesugaringEnabled true"
              text = text.replace(marker, marker + setting, 1)
          if "desugar_jdk_libs" not in text:
              dep = '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' if kotlin_dsl else "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n"
              text += dep
          app.write_text(text)
          print("Java core library desugaring enabled for flutter_local_notifications.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://zhvfudtdnvgsqywojjrz.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_TQrHgIVWUTdaxB_-OrGzWA_pAK4cj57
      - uses: actions/upload-artifact@v4
        with:
          name: kuaforum-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
